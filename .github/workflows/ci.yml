name: GraphOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m unittest discover -s tests -v
      - run: node --check src/graphops/static/app.js
      - run: node tests/test_ui_state.js

  falkordb-integration:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:v4.8.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/seed_falkordb.py
      - run: python -m pytest tests/test_falkordb_integration.py -q
        env:
          GRAPHOPS_RUN_FALKORDB_TESTS: "1"
          FALKORDB_ENABLED: "true"
